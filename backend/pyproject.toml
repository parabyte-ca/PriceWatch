[project]
name = "pricewatch"
version = "1.6.1"
description = "Self-hosted Canadian wishlist price tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.0.57",
  "alembic==1.20.1",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "apscheduler==3.11.3",
  "apprise==2.2.0",
  "prometheus-client==0.26.0",
  "itsdangerous==2.2.0",
  "python-multipart==0.0.33",
  "rapidfuzz==3.14.6",
  "tzdata==2026.6",
  "pywebpush==2.5.0",
  "anthropic==2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "respx==0.23.1",
  "ruff==0.17.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
