# PriceWatch CA. Settings live in .env (created by setup.sh from .env.example).
name: pricewatch

services:
  pricewatch:
    image: ${PRICEWATCH_IMAGE:-ghcr.io/parabyte-ca/pricewatch}:${PRICEWATCH_VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${PRICEWATCH_VERSION:-0.0.0}
    container_name: pricewatch
    restart: unless-stopped
    env_file: ${PRICEWATCH_ENV_FILE:-.env}
    environment:
      PRICEWATCH_DATA_DIR: /data
      PRICEWATCH_PORT: "8086"
    ports:
      - "${PRICEWATCH_HOST_PORT:-8086}:8086"
    volumes:
      - ${PRICEWATCH_DATA_PATH:-./data}:/data
      # in-app updates: request inbox (container writes) and agent status (read-only)
      - ./upgrade:/upgrade
      - ./upgrade-status:/upgrade-status:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The browser sidecar was removed in 1.0. This placeholder never runs (scale 0): it lets update scripts from before
  # 1.0 finish ("docker compose build browser") and makes "docker compose up" remove the old container.
  browser:
    image: busybox:1.37
    container_name: pricewatch-browser
    scale: 0
